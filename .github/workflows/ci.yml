name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and Build all projects
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $projects = Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }

          if ($projects.Count -eq 0) {
            Write-Error "No .csproj files found."
          }

          foreach ($project in $projects) {
            Write-Host "Building $($project.FullName)"
            dotnet build $project.FullName --configuration Release
          }

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $projects = Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }

          if ($projects.Count -eq 0) {
            Write-Error "No .csproj files found."
          }

          $testProjects = $projects | Where-Object {
            Select-String -Path $_.FullName -Pattern "Microsoft.NET.Test.Sdk" -Quiet
          }

          if ($testProjects.Count -eq 0) {
            Write-Host "No test projects detected (missing Microsoft.NET.Test.Sdk). Skipping dotnet test."
            return
          }

          foreach ($project in $testProjects) {
            Write-Host "Testing $($project.FullName)"
            dotnet test $project.FullName --configuration Release
          }
